<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StormStorage</title>
<style>
:root{
  --bg:#0f0f1a; --panel:#16192e; --border:#2a2d45; --brand:#e94560;
  --ok:#50fa7b; --warnc:#f1fa8c; --err:#ff5555; --accent:#8be9fd;
  --muted:#8890b5; --fg:#e6e6f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:16px;margin-bottom:2px}
h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
.chip{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600}
.c-ok{background:rgba(80,250,123,.15);color:var(--ok)}
.c-warn{background:rgba(241,250,140,.15);color:var(--warnc)}
.c-err{background:rgba(255,85,85,.18);color:var(--err)}
.c-mut{background:rgba(136,144,181,.15);color:var(--muted)}
.c-acc{background:rgba(139,233,253,.15);color:var(--accent)}
button,select,input{background:#1d2140;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.danger{color:var(--err)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.dim{color:var(--muted)}
#events{margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-height:200px;overflow-y:auto}
.ev{font-size:12px;padding:2px 0;border-bottom:1px solid rgba(42,45,69,.5)}
.ev:last-child{border-bottom:none}
.ev .t{color:var(--muted);margin-right:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
#err{color:var(--err);font-size:12px;margin:8px 0;display:none}
.wrap{overflow-x:auto}
form.create{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body>
<h1>StormStorage</h1>
<div class="sub" id="head">…</div>
<div id="err"></div>

<h2>Nodes</h2>
<div class="wrap"><table>
<thead><tr><th>Node</th><th>Engine</th><th>Tier</th><th>Labels</th><th>Health</th><th>Free / Total</th><th>Vols</th></tr></thead>
<tbody id="nodes"></tbody>
</table></div>

<h2>Pools</h2>
<div class="wrap"><table>
<thead><tr><th>Pool</th><th>Kind</th><th>What</th><th>Vols</th><th>Free / Total</th></tr></thead>
<tbody id="pools"></tbody>
</table></div>

<h2>Node volumes</h2>
<div class="wrap"><table>
<thead><tr><th>Volume</th><th>Node</th><th>Size / Used</th><th>Role</th><th>Slab / Drive</th><th>Partners</th><th>Consumer</th><th>PV / PVC</th></tr></thead>
<tbody id="nvols"></tbody>
</table></div>

<h2>Volumes</h2>
<form class="create" onsubmit="return createVol(event)">
  <input id="v-name" placeholder="name" required>
  <input id="v-size" type="number" placeholder="GiB" required min="1" style="width:80px">
  <select id="v-pool"><option value="">no pool</option></select>
  <input id="v-repl" type="number" placeholder="legs" min="1" style="width:60px">
  <button type="submit">Create</button>
</form>
<div class="wrap"><table>
<thead><tr><th>Volume</th><th>Size</th><th>Pool</th><th>Legs</th><th>Rung</th><th>Assembly</th><th>Export</th><th></th></tr></thead>
<tbody id="vols"></tbody>
</table></div>

<div id="events"><h2 style="margin-top:0">Events</h2><div id="evlist"></div></div>
<script>
const m = location.pathname.match(/^(\/ui\/(?:proxy|ext)\/[^\/]+\/)/);
const API = m ? m[1] : '/';
const $ = id => document.getElementById(id);
function human(b){ if(!b) return '0'; const u=['B','KiB','MiB','GiB','TiB','PiB']; let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++} return b.toFixed(b>=100||i===0?0:1)+' '+u[i]; }
function chip(t,c){return `<span class="chip ${c}">${t}</span>`}
// [api] api_token (#6): a write answered 401 asks for the token once and
// keeps it for this tab.
function tok(){try{return sessionStorage.getItem('ss-token')||''}catch(e){return ''}}
async function call(p,o){ o=o||{}; const h=()=>{const t=tok(); return Object.assign({},o.headers||{},t?{Authorization:'Bearer '+t}:{})};
  let r=await fetch(API+p,Object.assign({},o,{headers:h()}));
  if(r.status===401){ const t=prompt('This stormstorage needs its API token for changes:');
    if(t){ try{sessionStorage.setItem('ss-token',t.trim())}catch(e){}
      r=await fetch(API+p,Object.assign({},o,{headers:h()})); } }
  return r; }
async function api(p,o){ const r=await call(p,o);
  if(!r.ok){ let msg=r.status+' '+r.statusText; try{const j=await r.json(); if(j.error)msg=j.error}catch(e){}
    throw new Error(msg); } return r.json(); }
function post(p,b){return api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}
function fail(e){$('err').style.display='block';$('err').textContent=e.message||String(e);
  setTimeout(()=>{$('err').style.display='none'},7000)}
window.createVol=(ev)=>{ ev.preventDefault();
  const b={name:$('v-name').value, size_bytes:Number($('v-size').value)*1024**3};
  if($('v-pool').value) b.pool=$('v-pool').value;
  if($('v-repl').value) b.replicas=Number($('v-repl').value);
  post('api/v1/volumes',b).then(()=>{$('v-name').value='';refresh()}).catch(e=>{fail(e)});
  return false; };
window.moveLeg=(name,from)=>{
  if(confirm(`Move ${name}'s leg off ${from}? A new leg is placed automatically and rebuilt before ${from} is released.`))
    act(post(`api/v1/volumes/${encodeURIComponent(name)}/move`,{from}));
};
window.act=(p)=>p.then(refresh).catch(e=>{fail(e);refresh();});
window.pubVol=(n)=>act(post(`api/v1/volumes/${encodeURIComponent(n)}/export`,{}));
window.asmVol=(n)=>act(post(`api/v1/volumes/${encodeURIComponent(n)}/assemble`,{}));
// Copies in sync as read from the head's array (#33).
const syncChips=(x)=>{if(!x.replica_sync||x.legs.length<2)return '';
  const r=x.replica_sync,n=r.filter(y=>y.sync&&y.sync.state==='in_sync').length;
  let h=' '+chip(`in sync ${n}/${r.length}`,n>=x.replicas?'c-ok':'c-warn');
  for(const y of r){if(y.sync&&y.sync.state==='resyncing')h+=' '+chip(`${y.node} ${y.sync.progress_pct.toFixed(1)}%`,'c-warn');}
  if(x.fenced)h+=' '+chip(`fenced @${x.epoch}`,'c-warn');
  if(x.dual_attach)h+=' '+chip(`dual-attach ${x.dual_attach.target_node}`,'c-warn');
  return h;};
const expo=(x)=>{const e=x.export||{},c=e.coordinates,b=`<button title="publish / republish" onclick="pubVol('${x.name}')">↻</button>`;
  if(e.state==='published'&&c)return `<span class="mono" title="${c.nqn}">${c.traddr}:${c.trsvcid} ns ${c.nsid}</span>${e.coordinates_changed?' '+chip('moved','c-warn'):''} ${b}`;
  if(e.state==='failed')return `${chip('failed','c-err')} <span class="dim">${e.message||''}</span> ${b}`;
  if(e.state==='revoking')return `${chip('delete unfinished','c-warn')} <span class="dim">${e.message||''} — delete it again</span>`;
  if(e.state==='published'&&e.per_host)return chip(`${(e.hosts||[]).length} host(s)`,'c-ok')+' '+b;
  return x.assembly==='pending_engine_support'?'':b;};
window.delVol=(n)=>{ if(confirm(`Delete volume ${n} and all its legs?`))
  call(`api/v1/volumes/${encodeURIComponent(n)}`,{method:'DELETE'})
    .then(r=>{ if(!r.ok) return r.json().then(j=>{throw new Error(j.error||r.status)}); refresh(); })
    .catch(fail); };
async function refresh(){
  try{
    const [h,n,p,v,e]=await Promise.all([api('api/v1/health'),api('api/v1/nodes'),
      api('api/v1/pools'),api('api/v1/volumes'),api('api/v1/events')]);
    $('head').textContent=`v${h.version} · ${n.nodes.length} nodes · ${v.volumes.length} volumes`;
    $('nodes').innerHTML=n.nodes.map(x=>`<tr>
      <td class="mono">${x.name}</td>
      <td class="dim mono">${x.engine_url}</td>
      <td>${x.tier?chip(x.tier,'c-acc'):''}</td>
      <td class="dim">${Object.entries(x.labels||{}).map(([k,val])=>`${k}=${val}`).join(' ')}</td>
      <td>${x.status.healthy?chip('healthy','c-ok'):chip('unreachable','c-err')}</td>
      <td>${human(x.status.free_bytes)} / ${human(x.status.total_bytes)}</td>
      <td>${x.status.volumes||0}</td></tr>`).join('')
      ||'<tr><td colspan="7" class="dim">no nodes — no stormblock on this machine answered; add [[nodes]] to config or point a stormblock [stormfs] metadata_url here</td></tr>';
    const drv=d=>d?(d.serial||d.wwn||d.path||'?'):'';
    // A node volume's PV and its claim (#28): complete = Bound and naming each other.
    const pvc=p=>{if(!p)return '';const c=p.claim;const ok=p.phase==='Bound'&&c&&c.bound;
      const claim=c?`${c.namespace}/${c.name}${c.bound?'':' '+chip(c.phase?'not bound':'claim missing','c-warn')}`:chip('no claim','c-warn');
      return `${p.pv} ${ok?p.phase:chip(p.phase||'?','c-warn')}<br>${claim}${p.volume_kind?' '+chip(p.volume_kind,'c-mut'):''}`;};
    const what=x=>x.kind==='slab'?`${x.node} · ${x.role} · tier ${x.tier} · ${x.drive?'drive '+drv(x.drive):x.domain}`
      :x.kind==='tier'?`${x.slabs.length} slab(s) on ${x.nodes.join(', ')}`
      :`replicas ${x.replicas} at ${x.rung} · ${x.healthy}/${x.matched}: ${(x.nodes||[]).join(', ')}`;
    $('pools').innerHTML=p.pools.map(x=>`<tr>
      <td class="mono">${x.kind==='slab'?x.node+'/'+x.slab.slice(0,8):x.name}</td>
      <td>${chip(x.kind,x.kind==='policy'?'c-acc':'c-mut')}</td>
      <td class="dim">${what(x)}</td><td>${x.kind==='policy'?'':x.volumes}</td>
      <td>${human(x.free_bytes)} / ${human(x.total_bytes)}</td></tr>`).join('')
      ||'<tr><td colspan="5" class="dim">no pools — no engine found and none configured</td></tr>';
    const inv=await Promise.all(n.nodes.map(x=>api(`api/v1/nodes/${encodeURIComponent(x.name)}/inventory`)
      .then(i=>({node:x.name,i})).catch(()=>({node:x.name,i:{volumes:[]}}))));
    $('nvols').innerHTML=inv.flatMap(({node,i})=>(i.volumes||[]).map(v=>`<tr>
      <td class="mono">${v.name}${v.sealed?' '+chip('sealed','c-mut'):''}${v.kind&&v.kind!=='volume'?' '+chip(v.kind,'c-mut'):''}${v.in_use?' '+chip('in use '+(v.attachments||[]).map(a=>a.transport).join('+'),'c-acc'):''}</td><td class="mono">${node}</td>
      <td>${human(v.virtual_size_bytes)} / ${human(v.allocated_bytes)}</td><td>${v.role}</td>
      <td class="dim mono">${v.placement?(v.placement.slabs||[]).map(s=>`${s.id.slice(0,8)} ${drv(s.drive)}${s.node&&s.node!==node?'@'+s.node:''}${s.state!=='ok'?' '+chip(s.state,'c-err'):''}`).join('<br>')
        :v.slabs.length?v.slabs.map(s=>s.slice(0,8)).join('+'):'unknown'}${v.placement&&v.placement.rebuild&&v.placement.rebuild!=='none'?' '+chip('rebuild '+v.placement.rebuild,'c-warn'):''}</td>
      <td class="dim mono">${v.placement?(v.placement.arrays||[]).flatMap(a=>a.members).map(m=>`${drv(m.drive)}@${m.node} ${m.state==='active'?m.state:chip(m.state,'c-warn')}`).join('<br>'):''}</td>
      <td class="dim">${(c=>c?`${c.kind} ${c.namespace?c.namespace+'/':''}${c.name}`:'')(v.consumer||v.owner)}</td>
      <td class="dim mono">${pvc(v.pv)}</td></tr>`)).join('')
      ||'<tr><td colspan="8" class="dim">no node volumes</td></tr>';
    const sel=$('v-pool'); const cur=sel.value;
    sel.innerHTML='<option value="">no pool</option>'+p.pools.filter(x=>x.kind==='policy').map(x=>`<option>${x.name}</option>`).join('');
    sel.value=cur;
    $('vols').innerHTML=v.volumes.map(x=>`<tr>
      <td class="mono">${x.name}</td><td>${human(x.size_bytes)}</td>
      <td>${x.pool||''}</td>
      <td>${x.legs.map(l=>`${l.node}${l.state==='created'?'':' '+chip(l.state,'c-err')}${l.message?' '+chip(l.message,'c-warn'):''}${(x.assembly==='assembled'||x.assembly==='degraded')&&!x.replacing?` <button title="move this leg" onclick="moveLeg('${x.name}','${l.node}')">⇄</button>`:''}`).join(', ')}</td>
      <td>${x.rung}${x.head?` <span class="dim">head ${x.head}</span>`:''}</td>
      <td>${x.assembly==='assembled'?chip('raid1','c-ok'):x.assembly==='degraded'?chip('degraded','c-warn'):x.assembly==='pending_engine_support'?chip('pending','c-warn')+(x.legs.length>1?` <button title="retry the assembly" onclick="asmVol('${x.name}')">assemble</button>`:''):chip('single leg','c-mut')}${x.replacing?' '+chip(`re-leg ${x.replacing.from} → ${x.replacing.leg.node}`,'c-warn'):''}${syncChips(x)}</td>
      <td>${expo(x)}</td>
      <td><button class="danger" onclick="delVol('${x.name}')">✕</button></td></tr>`).join('')
      ||'<tr><td colspan="8" class="dim">no volumes</td></tr>';
    $('evlist').innerHTML=e.events.slice(-30).reverse().map(x=>{
      const t=x.time&&x.time.secs_since_epoch?new Date(x.time.secs_since_epoch*1000).toLocaleTimeString():'';
      const cls={info:'',warning:'c-warn',error:'c-err'}[x.severity]||'';
      return `<div class="ev"><span class="t">${t}</span><span class="${cls?'chip '+cls:''}">${x.severity}</span> ${x.message}</div>`;
    }).join('')||'<div class="dim">no events</div>';
  }catch(e){fail(e)}
}
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
