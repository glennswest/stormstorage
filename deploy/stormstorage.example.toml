# stormstorage.toml — /etc/stormstorage/stormstorage.toml
# Missing file = defaults. The testbed shape: three SNO clusters, three levels.

listen_addr = "0.0.0.0:9093"
data_dir    = "/var/lib/stormstorage"

[poll]
interval_secs  = 15
fail_threshold = 3

[federation]
# Top-down rung order for failure domains and spreading.
rungs = ["site", "building", "room", "row", "rack", "multicluster", "cluster", "node"]

# Static nodes. Nodes can also self-register: in a stormblock's config set
# [stormfs] enabled = true, metadata_url = "http://<this-host>:9093" and
# advertise_addr = "<engine-host>:9090", and it announces itself.
[[nodes]]
name       = "shelf25"                       # 2.5" NetApp shelf SNO cluster
engine_url = "http://192.168.8.150:9090"
tier       = "high"
labels     = { site = "gw", rack = "r1" }

[[nodes]]
name       = "shelf35"                       # 3.5" NetApp shelf SNO cluster
engine_url = "http://192.168.8.151:9090"
tier       = "medium"
labels     = { site = "gw", rack = "r1" }

[[nodes]]
name       = "pve-backup"                    # PVE-hosted backup cluster
engine_url = "http://192.168.8.152:9090"
tier       = "backup"
labels     = { site = "gw", rack = "r2" }

# Adopt the stormblock on this machine and the live peers of its cluster
# (on by default; this is what makes a node's slabs show up as pools).
# Nodes named in [[nodes]] or by heartbeat are left as they are.
[local]
enabled       = true
engine_url    = "http://127.0.0.1:9090"
cluster_peers = true
# name       = "…"                      # default: the engine's own name
# token_file = "/etc/stormblock/api_token"  # $STORMBLOCK_API_TOKEN wins;
#                                            # stormcos ships /run/stormblock/engine/api_token
# tier       = "high"                   # tier role for adopted nodes

# Re-leg a distributed volume when a leg's node is lost (#1), and retry a
# failed assembly (#7).
[recovery]
# enabled = true           # default: on alone, off with [replication] peers —
#                          # with peers, set true on exactly one instance
cooldown_secs        = 300   # after a failed re-leg or assembly attempt
rebuild_timeout_secs = 3600  # new member must be active by then

# Each node volume's PV/PVC, from the node's apiserver (#28).
[kubernetes]
# enabled = true
# server = "https://127.0.0.1:6443"   # TLS unverified on loopback
# token_file = "/data/stormcert/node-admin.token"   # default search; $KUBE_TOKEN wins
# ca_file = "/data/stormcert/ca.crt"

[[pools]]
name     = "fast"
selector = { tier = "high" }
replicas = 1
rung     = "node"

[[pools]]
name     = "capacity"
selector = { tier = "medium" }
replicas = 1
rung     = "node"

# Mirrored across the two shelf clusters: legs are assembled into a RAID1
# on the head node (needs stormblock with #73, 2026-08-28 or later).
[[pools]]
name     = "protected"
selector = { labels = { site = "gw" } }
replicas = 2
rung     = "cluster"

[api]
# Set: every write (volume create/delete/move/export/assemble, replicate)
# needs `Authorization: Bearer <token>`, and peer pushes send it, so peers
# share one token. Reads and self-registration stay open. Empty: no auth (#6).
api_token = ""

# Peer stormstorage instances (one per site/cluster). Durable state
# (volumes, registered nodes, orphaned legs) replicates to peers on change,
# last-writer-wins by revision; each peer polls the engines itself.
[replication]
peers = []          # e.g. ["http://siteb:9093"]
