[package]
name = "stormstorage"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Storage control plane across Storm nodes and clusters — registry, pools, placement, distributed volumes, tiering"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
stormview = { git = "https://github.com/glennswest/stormview", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
